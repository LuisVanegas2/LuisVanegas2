  <style>
    .speed { animation: pulse 1.6s ease-in-out infinite; transform-origin: 905px 165px; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.05); opacity:1 } }
    .spiral { animation: spin 6s linear infinite; transform-origin: 0 0; }
    @keyframes spin { to { transform: rotate(-360deg) } }
    .lid { animation: blink 5s ease-in-out infinite; transform-origin: 905px 165px; }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1) } 94% { transform: scaleY(.08) } }
    .go { animation: shake .25s steps(2) infinite; }
    .go2 { animation: shake .3s steps(2) infinite .1s; }
    @keyframes shake { 0% { transform: translate(0,0) } 100% { transform: translate(2px,-2px) } }
    .glow { animation: glow 2s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:.6 } 50% { opacity:1 } }
  </style>
</defs>
