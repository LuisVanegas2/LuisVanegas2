<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
<style>
 .arrow { animation: nudge 1.4s ease-in-out infinite; }
 @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(14px) } }
 .t { animation: fl 2.4s ease-in-out infinite; }
 @keyframes fl { 0%,100% { opacity:.75 } 50% { opacity:1 } }
</style>
<g class="arrow">
  <polygon points="760,30 1080,30 1120,60 1080,90 760,90 790,60" fill="#f2f2f2" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <text class="t" x="935" y="72" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="34" font-weight="900" fill="#000" letter-spacing="10">つづく</text>
</g>
<text x="80" y="70" font-family="'Courier New',monospace" font-size="16" fill="#9a9a9a" letter-spacing="4">— FIN DEL CAPÍTULO 01 —</text>
</svg>