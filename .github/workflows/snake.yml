name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#000000&color_dots=#ebedf0,#c6c6c6,#8b8b8b,#4d4d4d,#1a1a1a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#333333,#5c5c5c,#9a9a9a,#e6e6e6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
