name: Actualizar tarjetas de estadísticas

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LuisVanegas2&show_icons=true&hide_border=true&bg_color=0d1117&title_color=ffffff&text_color=c9c9c9&icon_color=ffffff&ring_color=ffffff&rank_icon=github&locale=es
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=LuisVanegas2&layout=compact&hide_border=true&bg_color=0d1117&title_color=ffffff&text_color=c9c9c9&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de GuauMiau
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=gminos&repo=GuauMiau&hide_border=true&bg_color=0d1117&title_color=ffffff&text_color=c9c9c9&icon_color=ffffff&show_owner=true&locale=es
          path: profile/pin-guaumiau.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualiza tarjetas de estadísticas" || exit 0
          git pull --rebase
          git push
